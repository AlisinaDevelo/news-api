services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  fake-gnews:
    image: node:22-alpine
    ports:
      - "4010:4010"
    working_dir: /app
    command: ["node", "/app/scripts/fake-gnews-provider.mjs"]
    environment:
      PORT: "4010"
      FAKE_GNEWS_DELAY_MS: "1200"
    volumes:
      - ./scripts:/app/scripts:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    depends_on:
      fake-gnews:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GNEWS_API_KEY: ci
      GNEWS_BASE_URL: http://fake-gnews:4010
      PORT: "3000"
      NODE_ENV: production
      DISABLE_RATE_LIMIT: "1"
      LOG_LEVEL: silent
      REDIS_URL: redis://redis:6379
      CACHE_LEASE_TTL_MS: "400"
      CACHE_LEASE_HEARTBEAT_MS: "200"
      CACHE_LEASE_WAIT_MS: "1500"

  rate-limit-a:
    build: .
    depends_on:
      fake-gnews:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      GNEWS_API_KEY: ci
      GNEWS_BASE_URL: http://fake-gnews:4010
      PORT: "3000"
      NODE_ENV: production
      DISABLE_RATE_LIMIT: "0"
      RATE_LIMIT_MAX: "1"
      TRUST_PROXY: "1"
      LOG_LEVEL: silent
      REDIS_URL: redis://redis:6379
      CACHE_LEASE_TTL_MS: "400"
      CACHE_LEASE_HEARTBEAT_MS: "200"
      CACHE_LEASE_WAIT_MS: "1500"

  rate-limit-b:
    build: .
    depends_on:
      fake-gnews:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3002:3000"
    environment:
      GNEWS_API_KEY: ci
      GNEWS_BASE_URL: http://fake-gnews:4010
      PORT: "3000"
      NODE_ENV: production
      DISABLE_RATE_LIMIT: "0"
      RATE_LIMIT_MAX: "1"
      TRUST_PROXY: "1"
      LOG_LEVEL: silent
      REDIS_URL: redis://redis:6379
      CACHE_LEASE_TTL_MS: "400"
      CACHE_LEASE_HEARTBEAT_MS: "200"
      CACHE_LEASE_WAIT_MS: "1500"
